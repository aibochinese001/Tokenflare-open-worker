name: keypool health check

# Background key health-check: drains one rotating sweep batch (~48 due keys),
# reviving recovered ones / disabling dead ones, then refreshes model status.
# Use this when the Cloudflare cron-trigger slots are full.
#
# At large pool sizes one batch per run rotates slowly (≈ pool/48 runs to cover
# everything). For faster coverage point a 1-minute pinger (cron-job.org) at the
# same POST $KEYPOOL_URL/admin/sweep endpoint — both share the rotation cursor.
#
# Set two repo secrets (Settings → Secrets and variables → Actions):
#   KEYPOOL_URL          e.g. https://your-worker.example.com
#   KEYPOOL_ADMIN_TOKEN  the ADMIN_TOKEN secret

on:
  schedule:
    - cron: "*/10 * * * *" # every ~10 min (GitHub may delay scheduled runs)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: probe a rotating batch (revive / disable)
        env:
          KEYPOOL_URL: ${{ secrets.KEYPOOL_URL }}
          KEYPOOL_ADMIN_TOKEN: ${{ secrets.KEYPOOL_ADMIN_TOKEN }}
        run: |
          if [ -z "$KEYPOOL_URL" ] || [ -z "$KEYPOOL_ADMIN_TOKEN" ]; then
            echo "Set KEYPOOL_URL and KEYPOOL_ADMIN_TOKEN repo secrets."; exit 1
          fi
          curl -sS -X POST "$KEYPOOL_URL/admin/sweep" \
            -H "Authorization: Bearer $KEYPOOL_ADMIN_TOKEN" --max-time 110
          curl -sS -X POST "$KEYPOOL_URL/admin/probe-models" \
            -H "Authorization: Bearer $KEYPOOL_ADMIN_TOKEN" --max-time 110
